name: nerve_network_ninja
description: Network Ninja adapter for Nerve.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  nerve_core:
    path: ../nerve_core
  nerve_flutter:
    path: ../nerve_flutter
  # Upstream has no tags; pin the verified commit SHA instead of floating `main`
  # so every consumer resolves the exact same code (currently main HEAD).
  network_ninja:
    git:
      url: https://github.com/YangLi-dev/network_ninja.git
      ref: 935c2322d14f269626e3a42c54d4fb4564189d14

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
